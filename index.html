        <h1 style="font-size:28px;margin:0 0 8px">BlackWater Marketing — Full-Stack E-Commerce Growth Partner</h1>
        <p style="font-size:18px;color:#C8D746;margin:0 0 24px">A full-stack partner for e-commerce and DTC brands. Paid ads, funnels, creative, retention and conversion handled as one system rather than six separate vendors.</p>

        <h2 style="font-size:20px;margin:24px 0 8px">What we do</h2>
        <ul>
          <li>Paid ads across Meta, TikTok and Google, run as one budget</li>
          <li>Funnel creation &amp; optimization, from ad click to checkout</li>
          <li>Ad creative strategy &amp; generation</li>
          <li>Email &amp; SMS retention marketing</li>
          <li>Conversion rate optimization (CRO)</li>
          <li>B2B marketing &amp; CRM automation</li>
          <li>Web design</li>
        </ul>

        <h2 style="font-size:20px;margin:24px 0 8px">How we work</h2>
        <p>As a partner, not a vendor. Most agencies take one channel, run it, and hand everything around it back to the brand. We take on the whole growth side, so the ads, the funnel they point at, the creative that fills them, the email that follows up, and the site that converts are all decided together by the same person. Jack Carnes is personally on every account. Nobody gets handed to an account manager two weeks in.</p>

        <h2 style="font-size:20px;margin:24px 0 8px">Who we help</h2>
        <p>E-commerce and direct-to-consumer brands, including apparel, supplement, jewelry and other online stores, that want one partner accountable for growth instead of coordinating several suppliers. We also work with a small number of service businesses.</p>

        <h2 style="font-size:20px;margin:24px 0 8px">About the founder</h2>
        <p>BlackWater Marketing was founded by Jack Carnes. He started by running ads for his own brand, and now works as an embedded growth partner to the brands he takes on rather than an outside supplier.</p>

        <h2 style="font-size:20px;margin:24px 0 8px">Frequently asked questions</h2>
        <p><strong>What does BlackWater Marketing do?</strong><br>BlackWater Marketing is a full-stack e-commerce partner. Rather than running one channel and handing the rest back, we take on the whole growth side of the business: paid ads across Meta, TikTok and Google, the funnel behind them, ad creative, email and SMS retention, conversion optimization, and the site itself.</p>
        <p><strong>Who is BlackWater Marketing for?</strong><br>E-commerce and DTC brands that want a single partner accountable for growth rather than a separate agency for each channel.</p>
        <p><strong>What makes it a partnership rather than an agency retainer?</strong><br>One person owns the whole picture and stays on the account. Decisions about ads, funnel, creative, retention and the site get made together instead of by suppliers who cannot see each other's work.</p>
