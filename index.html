      <div style="max-width:820px;margin:0 auto;padding:48px 20px;font-family:'Space Grotesk',system-ui,sans-serif;color:#f2ede4;background:#080808;line-height:1.6">
        <h1 style="font-size:28px;margin:0 0 8px">BlackWater Marketing | Full-Stack E-Commerce Growth Partner</h1>
        <p style="font-size:18px;color:#C8D746;margin:0 0 24px">We help e-commerce brands get more sales. We run your ads, make the videos, fix the pages, and emails behind them. One team, start to finish.</p>

        <h2 style="font-size:20px;margin:24px 0 8px">What we do</h2>
        <ul>
          <li>Paid ads on Meta (Facebook and Instagram), TikTok and Google</li>
          <li>Funnels: every step from ad click to checkout</li>
          <li>Ad creative: ideas, hooks, scripts and creator videos</li>
          <li>Email and SMS marketing that brings customers back</li>
          <li>Conversion rate optimization (CRO), so more visitors buy</li>
          <li>B2B marketing and CRM setup</li>
          <li>Web design and landing pages</li>
        </ul>

        <h2 style="font-size:20px;margin:24px 0 8px">How we work</h2>
        <p>As a partner, not a vendor. Most agencies run one thing, like your ads, and leave the rest to you. We handle all of it: the ads, the videos in them, the pages they send people to, and the emails after. One team owns the results, instead of six companies blaming each other.</p>
        <p>Every account follows the same four steps: one tested playbook, ads shown to people ready to buy, creators who film your ads, and new ads tested every week.</p>

        <h2 style="font-size:20px;margin:24px 0 8px">Who we help</h2>
        <p>E-commerce and direct-to-consumer (DTC) brands, including apparel, supplement, jewelry and other online stores, that want one partner in charge of growth. We also work with a small number of service businesses.</p>

        <h2 style="font-size:20px;margin:24px 0 8px">About the founder</h2>
        <p>BlackWater Marketing was founded by Jack Carnes. He started by running ads for his own brand. Today he works on every account he takes on himself, instead of handing it to someone else.</p>

        <h2 style="font-size:20px;margin:24px 0 8px">Frequently asked questions</h2>
        <p><strong>What does it cost?</strong><br>It depends on what you need. We price it around your goals, not a set package. Most brands pay a monthly fee, and we give exact numbers on the call. Your ad money always goes straight to the ad platforms, never through us.</p>
        <p><strong>What kind of businesses do you work with?</strong><br>Mostly e-commerce brands that are ready to grow, plus a few local businesses we believe in.</p>
        <p><strong>How do I get started?</strong><br>Fill out the short application at blackwatermrkting.com and book a call, or email jack@blackwatermrkting.com.</p>
