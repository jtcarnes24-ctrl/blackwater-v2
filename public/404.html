<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — BlackWater Marketing</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/syne.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin />

    <style>
      /* Self-hosted (OFL) Google fonts, latin set: no third-party round trip,
         and preloaded so the swap lands before first paint where it can. */
      @font-face{font-family:'Inter';font-style:normal;font-weight:400 600;font-display:swap;src:url(/fonts/inter.woff2) format('woff2')}
      @font-face{font-family:'Syne';font-style:normal;font-weight:700 800;font-display:swap;src:url(/fonts/syne.woff2) format('woff2')}
      @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/space-grotesk.woff2) format('woff2')}
      @font-face{font-family:'Playfair Display';font-style:italic;font-weight:500 600;font-display:swap;src:url(/fonts/playfair-italic.woff2) format('woff2')}
    </style>
    <style>
      html,body{margin:0;padding:0;background:#080808;color:#fff;min-height:100%}
      .wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;gap:1.25rem}
      h1{font-family:'Syne',sans-serif;font-size:clamp(2.5rem,8vw,5rem);font-weight:800;letter-spacing:-.03em;text-transform:uppercase;margin:0}
      .emph{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:500;text-transform:none;letter-spacing:0}
      p{font-family:'Space Grotesk',sans-serif;color:rgba(255,255,255,.72);max-width:44ch;line-height:1.6;margin:0}
      a{font-family:'Space Grotesk',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#080808;background:#fff;text-decoration:none;padding:.85rem 2rem;border-radius:100px;margin-top:.75rem}
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Page <span class="emph">not found.</span></h1>
      <p>That page does not exist. It may have moved, or the link may be wrong.</p>
      <a href="/">Back to home</a>
    </div>
  </body>
</html>
